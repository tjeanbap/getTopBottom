<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top & Bottom Standards Widget</title>
  <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      padding: 12px;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section {
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .top-label    { color: #059669; }
    .bottom-label { color: #dc2626; }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .card-top {
      background: #d1fae5;
      color: #065f46;
      border-left: 4px solid #059669;
    }

    .card-bottom {
      background: #fee2e2;
      color: #7f1d1d;
      border-left: 4px solid #dc2626;
    }

    .card-rank {
      font-size: 10px;
      font-weight: 700;
      opacity: 0.6;
      min-width: 20px;
    }

    .card-name {
      flex: 1;
      padding: 0 10px;
    }

    .bar-top    { background: #059669; }
    .bar-bottom { background: #dc2626; }

    .no-data {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      padding: 20px 10px;
      background: #fff;
      border-radius: 8px;
      border: 1px dashed #d1d5db;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 12px 0;
    }

    .tie-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 5px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    .card-top    .tie-badge { background: #a7f3d0; color: #065f46; }
    .card-bottom .tie-badge { background: #fecaca; color: #7f1d1d; }

    .tie-note {
      font-size: 11px;
      color: #6b7280;
      margin-top: -2px;
      margin-bottom: 8px;
      padding-left: 2px;
    }
  </style>
</head>
<body>

<div id="widget-root">
  <div class="no-data">Loading scores…</div>
</div>
<div id="debug-log" style="margin-top:8px;font-size:10px;font-family:monospace;color:#666;word-break:break-all;max-height:200px;overflow-y:auto;"></div>

<script>
  // ── Global error trap — shows JS errors directly in the widget UI ──────────
  window.onerror = function(msg, src, line) {
    var root = document.getElementById("widget-root");
    if (root) root.innerHTML = '<div class="no-data" style="color:#b91c1c;border-color:#fca5a5">JS Error: ' + msg + ' (line ' + line + ')</div>';
  };

  var MAX_SCORE = 7; // each standard has 7 True/False questions

  // ── Hardcoded standard → field ID mapping for form 261576270259059 ─────────
  var STANDARDS = [
    { name: "Clear Vision",         fieldId: "t",    score: 0 },
    { name: "Healthy Partnerships", fieldId: "t133", score: 0 },
    { name: "Fruitful Ministry",    fieldId: "t169", score: 0 },
    { name: "Effective Operations", fieldId: "t172", score: 0 },
    { name: "Qualified Leadership", fieldId: "t175", score: 0 },
    { name: "Impactful Training",   fieldId: "t185", score: 0 },
    { name: "Kingdom Stewardship",  fieldId: "t187", score: 0 }
  ];

  // Fast lookup: fieldId → STANDARDS index
  var FIELD_INDEX = {};
  STANDARDS.forEach(function(s, i) { FIELD_INDEX[s.fieldId] = i; });

  function buildStandards() {
    return STANDARDS.map(function(s) {
      return { name: s.name, score: s.score };
    });
  }

  // Returns { top, bottom, topTiers, bottomTiers, allEqual }
  // top/bottom include ALL standards sharing the top-2 or bottom-2 distinct score values,
  // so tied boundaries expand the list beyond 2 cards.
  function getTopBottom(standards) {
    var sorted = standards.slice().sort(function(a, b) { return b.score - a.score; });

    var allEqual = sorted.every(function(s) { return s.score === sorted[0].score; });
    if (allEqual) return { top: [], bottom: [], topTiers: [], bottomTiers: [], allEqual: true };

    // Top tiers: if 2+ share the highest score, show only that tier.
    // If exactly 1 holds the top score, also include the 2nd-highest tier.
    var topScore1 = sorted[0].score;
    var topGroup1Count = sorted.filter(function(s) { return s.score === topScore1; }).length;
    var topTiers = [topScore1];
    if (topGroup1Count < 2) {
      sorted.forEach(function(s) {
        if (topTiers.length < 2 && topTiers.indexOf(s.score) === -1) topTiers.push(s.score);
      });
    }

    // Bottom tiers: same rule in reverse.
    var bottomScore1 = sorted[sorted.length - 1].score;
    var bottomGroup1Count = sorted.filter(function(s) { return s.score === bottomScore1; }).length;
    var bottomTiers = [bottomScore1];
    if (bottomGroup1Count < 2) {
      for (var i = sorted.length - 1; i >= 0; i--) {
        if (bottomTiers.length < 2 && bottomTiers.indexOf(sorted[i].score) === -1) bottomTiers.push(sorted[i].score);
      }
    }
    // bottomTiers[0] = lowest score, bottomTiers[1] = second-lowest (if included)

    var top    = sorted.filter(function(s) { return topTiers.indexOf(s.score)    !== -1; });
    var bottom = sorted.filter(function(s) { return bottomTiers.indexOf(s.score) !== -1; }).reverse();

    return { top: top, bottom: bottom, topTiers: topTiers, bottomTiers: bottomTiers, allEqual: false };
  }

  function makeCard(item, type, rank, isTied) {
    var cardClass = type === "top" ? "card card-top" : "card card-bottom";
    var tieBadge  = isTied ? '<span class="tie-badge">tie</span>' : "";

    return (
      '<div class="' + cardClass + '">' +
        '<span class="card-rank">#' + rank + '</span>' +
        '<div class="card-name">' +
          escapeHtml(item.name) + tieBadge +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function render(standards) {
    dbg("render: " + standards.map(function(s){ return s.name.split(" ")[0]+":"+s.score; }).join(" "));
    var root = document.getElementById("widget-root");

    var allZero = standards.every(function(s) { return s.score === 0; });
    if (allZero) {
      root.innerHTML = '<div class="no-data">Scores will appear here as you complete the assessment.</div>';
      JFCustomWidget.requestFrameResize({ height: 80 });
      return;
    }

    var tb = getTopBottom(standards);
    var html = "";

    if (tb.allEqual) {
      html += '<div class="card card-top" style="justify-content:center;text-align:center;">All standards have been assessed ' + standards[0].score + '/' + MAX_SCORE + '</div>';
      root.innerHTML = html;
      JFCustomWidget.requestFrameResize({ height: 80 });
      return;
    }

    html += '<div class="section">';
    html += '<div class="section-label top-label">Our two strongest standards are:</div>';
    tb.top.forEach(function(item) {
      var rank   = item.score === tb.topTiers[0] ? 1 : 2;
      var isTied = tb.top.filter(function(s) { return s.score === item.score; }).length > 1;
      html += makeCard(item, "top", rank, isTied);
    });
    html += '</div>';

    html += '<div class="divider"></div>';

    html += '<div class="section">';
    html += '<div class="section-label bottom-label">Our two weakest standards are:</div>';
    tb.bottom.forEach(function(item) {
      var rank   = item.score === tb.bottomTiers[0] ? 1 : 2;
      var isTied = tb.bottom.filter(function(s) { return s.score === item.score; }).length > 1;
      html += makeCard(item, "bottom", rank, isTied);
    });
    html += '</div>';

    root.innerHTML = html;
    var cardCount = tb.top.length + tb.bottom.length;
    JFCustomWidget.requestFrameResize({ height: 80 + cardCount * 52 });
  }

  function buildSummary() {
    var standards = buildStandards();
    var tb = getTopBottom(standards);
    if (tb.allEqual) {
      return "All standards tied at " + STANDARDS[0].score + "/" + MAX_SCORE;
    }
    var topStr    = tb.top.map(function(s)    { return s.name + " (" + s.score + "/" + MAX_SCORE + ")"; }).join(", ");
    var bottomStr = tb.bottom.map(function(s) { return s.name + " (" + s.score + "/" + MAX_SCORE + ")"; }).join(", ");
    var tieNotes  = [];
    if (tb.topTied)    { tieNotes.push("2nd place tied"); }
    if (tb.bottomTied) { tieNotes.push("2nd-to-last place tied"); }
    var out = "Top 2: " + topStr + " | Bottom 2: " + bottomStr;
    if (tieNotes.length) { out += " [" + tieNotes.join("; ") + "]"; }
    return out;
  }

  // Parse scores from the string Jotform delivers via widgetpopulate.
  // Jotform strips commas when resolving merge tags, so "3,5,2,7,4,1,6"
  // arrives as "3527416". Since each standard has max 7 questions every
  // score is a single digit — we read one character per standard.
  function parseAndApplyScores(str) {
    str = str.trim();
    // Prefer explicit separators if Jotform ever preserves them
    var parts;
    if (str.indexOf("|") !== -1)      { parts = str.split("|"); }
    else if (str.indexOf(",") !== -1)  { parts = str.split(","); }
    else                               { parts = str.split("");  } // digit-per-standard fallback
    parts.forEach(function(val, i) {
      if (i < STANDARDS.length) {
        var n = parseInt(val.trim(), 10);
        if (!isNaN(n) && n >= 0) STANDARDS[i].score = n;
      }
    });
  }

  // Decode the URL-encoded settings JSON Jotform sends and extract scores.
  // Format: "[{\"name\":\"scores\",\"value\":\"3,5,2,7,4,1,6\"}, ...]"
  function parseScoresFromSettings(raw) {
    if (!raw) return;
    try {
      var arr = JSON.parse(decodeURIComponent(raw));
      arr.forEach(function(item) {
        if (item.name === "scores" && item.value) {
          dbg("scores param: " + item.value);
          item.value.split(",").forEach(function(val, i) {
            if (i < STANDARDS.length) {
              var n = parseInt(val.trim(), 10);
              if (!isNaN(n) && n > 0) STANDARDS[i].score = n;
            }
          });
        }
      });
    } catch(e) {
      dbg("settings parse err: " + e.message);
    }
  }

  // ── Widget lifecycle ──────────────────────────────────────────────────────

  // Register for a field's change events using every message type Jotform supports.
  // Also subscribe using the bare numeric ID (e.g. "133" as well as "t133") since
  // Jotform may use either format internally.
  function subscribeToField(fieldId) {
    var numericId = fieldId.replace(/^[a-zA-Z]+/, ""); // "t133" → "133", "t" → ""
    ["event:listener", "event:store"].forEach(function(type) {
      try { parent.postMessage(JSON.stringify({ type: type, fieldID: fieldId }), "*"); } catch(e) {}
      if (numericId && numericId !== fieldId) {
        try { parent.postMessage(JSON.stringify({ type: type, fieldID: numericId }), "*"); } catch(e) {}
      }
    });
  }

  // Try to update a standard score from a raw field ID + value pair.
  // Accepts the ID as-is, with the "t" prefix stripped, or with it added.
  function applyFieldValue(fieldId, rawVal) {
    if (!fieldId) return false;
    var candidates = [fieldId, "t" + fieldId, fieldId.replace(/^t/, "")];
    for (var i = 0; i < candidates.length; i++) {
      var idx = FIELD_INDEX[candidates[i]];
      if (idx !== undefined) {
        var n = parseInt(rawVal, 10);
        STANDARDS[idx].score = isNaN(n) ? 0 : n;
        return true;
      }
    }
    return false;
  }

  function dbg(text) {
    var el = document.getElementById("debug-log");
    if (!el) return;
    var line = document.createElement("div");
    line.textContent = text;
    el.appendChild(line);
    el.scrollTop = el.scrollHeight;
    JFCustomWidget.requestFrameResize({ height: 400 });
  }

  // Confirm the library loaded before trying to subscribe
  if (typeof JFCustomWidget === "undefined") {
    document.getElementById("widget-root").innerHTML =
      '<div class="no-data" style="color:#b91c1c;border-color:#fca5a5">JFCustomWidget library failed to load.</div>';
  }

  JFCustomWidget.subscribe("ready", function() {
    dbg("ready. subscribing: " + STANDARDS.map(function(s){ return s.fieldId; }).join(","));
    STANDARDS.forEach(function(s) { subscribeToField(s.fieldId); });
    render(buildStandards());
  });

  // Listen for incoming messages from the Jotform parent.
  window.addEventListener("message", function(e) {
    try {
      var msg = (typeof e.data === "string") ? JSON.parse(e.data) : e.data;
      if (!msg || !msg.type) return;
      dbg("MSG: " + JSON.stringify(msg).slice(0, 250));

      if (msg.type === "widgetpopulate") {
        // Jotform conditional logic set this widget's value — parse scores from it
        var populated = msg.value || (msg.data && msg.data.value) || "";
        dbg("widgetpopulate: " + populated);
        if (populated) { parseAndApplyScores(populated); render(buildStandards()); }

      } else if (msg.type === "scoreUpdate" && Array.isArray(msg.scores)) {
        // Scores pushed in real-time by the Jotform custom code injection
        msg.scores.forEach(function(score, i) {
          if (i < STANDARDS.length) {
            var n = parseInt(score, 10);
            STANDARDS[i].score = isNaN(n) ? 0 : n;
          }
        });
        dbg("scoreUpdate: " + msg.scores.join(","));
        render(buildStandards());

      } else if (msg.type === "event:receiver") {
        // Field ID and value may live at the top level or inside msg.data
        var fieldId = msg.fieldID || msg.name  || (msg.data && (msg.data.fieldID || msg.data.name));
        var rawVal  = msg.value   || msg.val   || (msg.data && (msg.data.value   || msg.data.val)) || "0";
        if (applyFieldValue(fieldId, rawVal)) {
          render(buildStandards());
        }

      } else if (msg.type === "settings") {
        // Parse scores directly from the raw URL-encoded settings JSON.
        // JFCustomWidget may not have updated its internal store yet, so we
        // decode msg.settings ourselves rather than calling getWidgetSetting().
        parseScoresFromSettings(msg.settings);
        render(buildStandards());
      }
    } catch (err) { /* ignore non-JSON frames */ }
  });

  JFCustomWidget.subscribe("submit", function(data) {
    // At submit time Jotform re-evaluates merge tags — re-parse settings now
    parseScoresFromSettings(data && data.settings);
    // Also try via getWidgetSetting in case the store was updated by now
    var scoresParam = JFCustomWidget.getWidgetSetting("scores");
    if (scoresParam) {
      scoresParam.split(",").forEach(function(val, i) {
        if (i < STANDARDS.length) {
          var n = parseInt(val.trim(), 10);
          if (!isNaN(n) && n > 0) STANDARDS[i].score = n;
        }
      });
    }
    render(buildStandards());
    JFCustomWidget.sendSubmit({ valid: true, value: buildSummary() });
  });
</script>
</body>
</html>
